[buildout]
extensions =
    mr.developer
    plone.versioncheck
allow-picked-versions = false
develop = .
extends =
    sources.cfg
    versions.cfg
installed = .installed.cfg
parts =
    test
    zopescripts
    alltests
    allpy
    checkversions
    requirements
sources-dir = develop
root-directory = ${buildout:directory}
auto-checkout =
    ZODB

[sources]
ZODB += branch=master

[testenv]
PYTHONHASHSEED = random

[test]
recipe = zc.recipe.testrunner
script = test
environment = testenv
initialization =
    import sys
    import warnings
    warnings.simplefilter('default')
eggs = Zope


[zopescripts]
recipe = zc.recipe.egg
interpreter = zopepy
eggs =
    Zope[wsgi]


[alltests]
recipe = zc.recipe.testrunner
script = alltests
environment = testenv
eggs =
    AccessControl
    Acquisition
    DateTime
    DocumentTemplate
    ExtensionClass
    MultiMapping
    Persistence
    zExceptions
    Zope
# Test optional dependencies.
    five.localsitemanager
    Missing
    Products.BTreeFolder2
    Products.ZCatalog
    Record


[allpy]
recipe = zc.recipe.egg
eggs = ${alltests:eggs}
interpreter = allpy


[checkversions]
recipe = zc.recipe.egg
eggs = plone.versioncheck


[requirements]
recipe = plone.recipe.command
command =
    ${zopescripts:bin-directory}/${zopescripts:interpreter} ${buildout:root-directory}/util.py
update-command = ${:command}
stop-on-error = yes
